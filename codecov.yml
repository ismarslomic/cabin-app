# Generated from the OpenAPI spec; not worth measuring.
ignore:
  - 'src/shared/api/schema.ts'

coverage:
  status:
    project:
      default:
        # Fail the check only if total coverage drops by more than 2 points.
        target: auto
        threshold: 2%
    patch:
      default:
        # Coverage of the lines changed in a pull request. A fixed target: the app is small, so a
        # relative one (auto) swings on a few lines.
        target: 80%

comment:
  layout: 'diff, files'
  require_changes: true
