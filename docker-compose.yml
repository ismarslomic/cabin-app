# Runs the app on the Raspberry Pi: this is the file that is deployed there, copied as it is.
# TLS is terminated by the Cloudflare Tunnel, a container on the shared "cabin-visits-shared" Docker
# network; the app is not published on a host port. In the tunnel's public hostname settings, point
# the service at http://cabin-app:8080.
# To deploy a release: change the image tag below, then `docker compose pull && docker compose up -d`.
# Diun (labels below) tells you when a new release is published.
services:
  cabin-app:
    container_name: cabin-app
    image: ghcr.io/ismarslomic/cabin-app:0.1.0
    expose:
      - '8080'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      - 'diun.enable=true'
      - 'diun.watch_repo=true'
      - 'diun.include_tags=^(\d+\.\d+\.\d+)$$'
      - 'diun.sort_tags=semver'
      - 'diun.max_tags=10'
    networks:
      cabin-visits-shared:

networks:
  cabin-visits-shared:
    # Already exists: it is shared with the Cloudflare Tunnel container (and the other cabin apps).
    external: true
